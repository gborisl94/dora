<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b1a3a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Indie Miami Archer — ISO</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100%; height:100%;
    overflow:hidden;
    background:#0b1a3a;
    touch-action:none;
    -webkit-user-select:none; user-select:none;
    -webkit-tap-highlight-color:transparent;
    -webkit-touch-callout:none;
    overscroll-behavior:none;
    font-family:monospace;
  }
  #c {
    display:block;
    width:100vw; height:100vh;
    background:#0b1a3a;
    image-rendering:pixelated;
  }

  /* Overlay "tourne ton téléphone" affiché en portrait */
  #rotate {
    position:fixed; inset:0;
    background:#0b1a3a; color:#ff3cac;
    display:none;
    align-items:center; justify-content:center;
    flex-direction:column;
    font-family:monospace; font-weight:bold;
    font-size:22px; text-align:center;
    z-index:9999;
    padding:20px;
  }
  #rotate .icon {
    font-size:70px;
    margin-bottom:24px;
    animation: spin 2s ease-in-out infinite;
  }
  #rotate .sub {
    font-size:14px; color:#1de9b6; margin-top:14px; letter-spacing:1px;
  }
  @keyframes spin {
    0%,100% { transform: rotate(0deg); }
    50%     { transform: rotate(90deg); }
  }
  @media (orientation: portrait) {
    #rotate { display:flex; }
    #c { display:none; }
  }
</style>
</head>
<body>
  <div id="rotate">
    <div class="icon">📱↻</div>
    <div>TOURNE TON TÉLÉPHONE</div>
    <div class="sub">MODE PAYSAGE REQUIS</div>
  </div>
  <canvas id="c"></canvas>
  <script src="game.js"></script>
</body>
</html>
